<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZPack AI Assistant - Hey Pack Edition</title>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --border-color: #1f2937;
            --meme-color: #ec4899;
            --expert-color: #10b981;
            --omni-color: #8b5cf6;
            --math-color: #f59e0b;
        }

        body.theme-meme { --accent-color: var(--meme-color); }
        body.theme-expert { --accent-color: var(--expert-color); }
        body.theme-omni { --accent-color: var(--omni-color); }
        body.theme-math { --accent-color: var(--math-color); }
        body.theme-normal { --accent-color: #3b82f6; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { background-color: var(--panel-bg); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 8px; }
        .logo { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        .mic-status { font-size: 0.75rem; background: #1f2937; padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 5px; }
        .mic-dot { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; display: inline-block; }
        .mic-dot.listening { background-color: #10b981; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .modes-container { display: flex; gap: 5px; flex-wrap: wrap; }
        .mode-btn { background: var(--border-color); color: var(--text-color); border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .mode-btn.active { background: var(--accent-color); }

        .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; word-break: break-word; line-height: 1.4; }
        .message.user { background-color: var(--accent-color); color: white; align-self: flex-end; }
        .message.ai { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 6px; display: block; }

        .quick-actions { padding: 8px 15px; display: flex; gap: 8px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); overflow-x: auto; }
        .action-chip { background: var(--border-color); color: var(--text-color); border: none; padding: 5px 10px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }

        .preview-box { padding: 6px 15px; background-color: var(--panel-bg); display: none; align-items: center; gap: 8px; border-top: 1px solid var(--border-color); }
        .preview-box img { height: 40px; border-radius: 4px; }
        .preview-box span { font-size: 0.8rem; color: #aaa; }
        .remove-btn { background: #ef4444; color: white; border: none; padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; }

        .input-area { padding: 10px 15px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
        .plus-btn, .mic-trigger-btn { background: var(--border-color); color: var(--text-color); border: none; width: 38px; height: 38px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .mic-trigger-btn.active { background: #10b981; color: white; }
        .input-area input[type="text"] { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; color: var(--text-color); font-size: 0.9rem; outline: none; }
        .send-btn { background-color: var(--accent-color); color: white; border: none; padding: 0 15px; height: 38px; border-radius: 6px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
    </style>
</head>
<body class="theme-normal">
    <header>
        <div class="logo">
            📦 EZPack AI
            <div class="mic-status">
                <span class="mic-dot" id="micDot"></span>
                <span id="micText">Voz Inactiva</span>
            </div>
        </div>
        <div class="modes-container">
            <button class="mode-btn active" id="btn-normal" type="button" onclick="cambiarModo('normal')">Amigable</button>
            <button class="mode-btn" id="btn-math" type="button" onclick="cambiarModo('math')">🧮 Mate</button>
            <button class="mode-btn" id="btn-expert" type="button" onclick="cambiarModo('expert')">Experta</button>
            <button class="mode-btn" id="btn-omni" type="button" onclick="cambiarModo('omni')">Omni</button>
            <button class="mode-btn" id="btn-meme" type="button" onclick="cambiarModo('meme')">Meme</button>
        </div>
    </header>

    <div class="chat-container" id="chat">
        <div class="message ai">¡Hola! Di o escribe <strong>"Hey Pack"</strong> seguido de lo que necesites: dime la hora, qué es alguna app/juego, resuelve operaciones con el modo Mate, o pídelo abrir aplicaciones y juegos web (YouTube, Minecraft Classic, Geometry Dash, etc.). 😊</div>
    </div>

    <div class="quick-actions">
        <button class="action-chip" type="button" onclick="accionRapida('Hey Pack, ¿qué hora es?')">⏰ ¿Qué hora es?</button>
        <button class="action-chip" type="button" onclick="accionRapida('Hey Pack, abre YouTube')">▶️ Abrir YouTube</button>
        <button class="action-chip" type="button" onclick="accionRapida('Hey Pack, resuelve 45 * 12 + 8')">🧮 Mate: 45*12+8</button>
        <button class="action-chip" type="button" onclick="accionRapida('Hey Pack, ¿qué es Mem Reduct?')">💻 ¿Qué es Mem Reduct?</button>
        <button class="action-chip" type="button" onclick="accionRapida('Hey Pack, abre Geometry Dash')">🎮 Abrir GD</button>
    </div>

    <div class="preview-box" id="previewBox">
        <img id="previewImg" src="" alt="preview">
        <span id="previewText">Imagen lista</span>
        <button class="remove-btn" type="button" onclick="quitarImagen()">X</button>
    </div>

    <div class="input-area">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="procesarArchivo(event)">
        <button class="plus-btn" type="button" onclick="document.getElementById('fileInput').click()" title="Subir imagen">+</button>
        <button class="mic-trigger-btn" id="micBtn" type="button" onclick="toggleReconocimientoVoz()" title="Activar escucha 'Hey Pack'">🎤</button>
        <input type="text" id="userInput" placeholder="Di 'Hey Pack' o escribe aquí..." onkeydown="if(event.key==='Enter') enviarMensaje()">
        <button class="send-btn" type="button" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        var modoActual = 'normal';
        var historial = [];
        var imagenBase64 = null;
        var reconocimientoVoz = null;
        var escuchandoVoz = false;

        // Inicializar reconocimiento de voz si el navegador lo soporta
        function inicializarVoz() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                reconocimientoVoz = new SpeechRecognition();
                reconocimientoVoz.lang = 'es-ES';
                reconocimientoVoz.continuous = true;
                reconocimientoVoz.interimResults = false;

                reconocimientoVoz.onresult = function(event) {
                    var ultimo = event.results.length - 1;
                    var textoTranscrito = event.results[ultimo][0].transcript.trim();
                    procesarComandoVoz(textoTranscrito);
                };

                reconocimientoVoz.onerror = function(event) {
                    console.error("Error en reconocimiento de voz:", event.error);
                };

                reconocimientoVoz.onend = function() {
                    if (escuchandoVoz) {
                        try { reconocimientoVoz.start(); } catch(e) {}
                    }
                };
            }
        }

        function toggleReconocimientoVoz() {
            if (!reconocimientoVoz) {
                inicializarVoz();
                if (!reconocimientoVoz) {
                    alert("Tu navegador no soporta reconocimiento de voz nativo.");
                    return;
                }
            }

            var micBtn = document.getElementById('micBtn');
            var micDot = document.getElementById('micDot');
            var micText = document.getElementById('micText');

            if (!escuchandoVoz) {
                try {
                    reconocimientoVoz.start();
                    escuchandoVoz = true;
                    micBtn.classList.add('active');
                    micDot.classList.add('listening');
                    micText.innerText = "Escuchando 'Hey Pack'...";
                    agregarMensaje("🎤 Asistente de voz activado. Di **'Hey Pack'** seguido de tu petición.", 'ai', null);
                } catch(e) {
                    console.error(e);
                }
            } else {
                escuchandoVoz = false;
                try { reconocimientoVoz.stop(); } catch(e) {}
                micBtn.classList.remove('active');
                micDot.classList.remove('listening');
                micText.innerText = "Voz Inactiva";
            }
        }

        function procesarComandoVoz(texto) {
            var textoLower = texto.toLowerCase();
            // Verificar activación por palabra clave
            if (textoLower.includes('hey pack') || textoLower.includes('ey pack') || textoLower.includes('ei pack')) {
                // Limpiar la frase de activación para extraer la orden
                var orden = texto.replace(/hey pack|ey pack|ei pack/gi, '').trim();
                var campo = document.getElementById('userInput');
                if (campo) {
                    campo.value = orden;
                }
                agregarMensaje("🎙️ **[Voz detectada]**: " + texto, 'user', null);
                setTimeout(function() {
                    procesarLogicaAsistente(orden, null);
                }, 300);
            }
        }

        function cambiarModo(nuevoModo) {
            modoActual = nuevoModo;
            document.body.className = 'theme-' + nuevoModo;
            
            var botones = document.querySelectorAll('.mode-btn');
            for(var i = 0; i < botones.length; i++) {
                botones[i].classList.remove('active');
            }
            var btnActivo = document.getElementById('btn-' + nuevoModo);
            if(btnActivo) btnActivo.classList.add('active');

            var msj = "Modo cambiado a: " + nuevoModo + ". ¡Listo con precisión total!";
            agregarMensaje(msj, 'ai', null);
        }

        function procesarArchivo(e) {
            var archivo = e.target.files[0];
            if(!archivo) return;
            var lector = new FileReader();
            lector.onload = function(evt) {
                imagenBase64 = evt.target.result;
                document.getElementById('previewImg').src = imagenBase64;
                document.getElementById('previewText').innerText = archivo.name;
                document.getElementById('previewBox').style.display = 'flex';
            };
            lector.readAsDataURL(archivo);
        }

        function quitarImagen() {
            imagenBase64 = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
        }

        function agregarMensaje(texto, remitente, img) {
            var contenedor = document.getElementById('chat');
            if(!contenedor) return;
            
            var div = document.createElement('div');
            div.className = 'message ' + remitente;
            
            var contenidoHtml = '';
            if(img) {
                contenidoHtml += '<img src="' + img + '">';
            }
            if(texto) {
                contenidoHtml += texto.replace(/\n/g, '<br>');
            }
            
            div.innerHTML = contenidoHtml;
            contenedor.appendChild(div);
            contenedor.scrollTop = contenedor.scrollHeight;
        }

        function accionRapida(textoAccion) {
            var campo = document.getElementById('userInput');
            if(campo) {
                campo.value = textoAccion;
                enviarMensaje();
            }
        }

        function enviarMensaje() {
            var campo = document.getElementById('userInput');
            if(!campo) return;
            
            var texto = campo.value.trim();
            var imgActual = imagenBase64;

            if(!texto && !imgActual) return;

            // Limpiar "Hey Pack" si el usuario lo escribió directamente
            var textoLimpio = texto.replace(/hey pack|ey pack|ei pack/gi, '').trim();

            historial.push({texto: texto, img: imgActual});
            agregarMensaje(texto, 'user', imgActual);
            
            campo.value = '';
            quitarImagen();

            setTimeout(function() {
                procesarLogicaAsistente(textoLimpio, imgActual);
            }, 300);
        }

        function resolverMatematicas(query) {
            var q = query.toLowerCase();
            try {
                if (q.indexOf('raiz') !== -1 || q.indexOf('raíz') !== -1) {
                    var nums = q.match(/\d+(\.\d+)?/g);
                    if (nums && nums.length > 0) {
                        var val = parseFloat(nums[0]);
                        var res = Math.sqrt(val);
                        return "🧮 **Modo Mate - Resultado:**\n√(" + val + ") = **" + res + "**";
                    }
                }
                
                if (q.indexOf('al cuadrado') !== -1 || q.indexOf('elevado a la 2') !== -1) {
                    var nums = q.match(/\d+(\.\d+)?/g);
                    if (nums && nums.length > 0) {
                        var val = parseFloat(nums[0]);
                        return "🧮 **Modo Mate - Resultado:**\n" + val + "² = **" + (val * val) + "**";
                    }
                }

                var expresionLimpia = q.replace(/resolver|cuanto es|resuelve|calcula|el resultado de|porcentaje de|de/g, '').trim();
                expresionLimpia = expresionLimpia.replace(/x/g, '*').replace(/÷/g, '/');
                expresionLimpia = expresionLimpia.replace(/[^0-9\+\-\*\/\.\(\)\s\%]/g, '');

                if (expresionLimpia.length > 0 && /\d/.test(expresionLimpia)) {
                    if (expresionLimpia.indexOf('%') !== -1) {
                        var partes = expresionLimpia.split('%');
                        if (partes.length >= 2) {
                            var p1 = parseFloat(partes[0]);
                            var p2Expr = partes[1].replace('*', '').trim();
                            var p2 = parseFloat(p2Expr);
                            if (!isNaN(p1) && !isNaN(p2)) {
                                var resPorc = (p1 * p2) / 100;
                                return "🧮 **Modo Mate - Porcentaje:**\n" + p1 + "% de " + p2 + " = **" + resPorc + "**";
                            }
                        }
                    }

                    var resultadoCalculado = Function('"use strict"; return (' + expresionLimpia + ')')();
                    if (!isNaN(resultadoCalculado) && isFinite(resultadoCalculado)) {
                        return "🧮 **Modo Mate - Resultado Exacto:**\n`" + expresionLimpia.replace(/\s+/g, '') + " = " + resultadoCalculado + "` ✨";
                    }
                }
            } catch (e) {}
            return null;
        }

        function abrirAppOJuego(query) {
            var q = query.toLowerCase();
            if (q.indexOf('abre') !== -1 || q.indexOf('abrir') !== -1 || q.indexOf('ejecuta') !== -1) {
                if (q.indexOf('youtube') !== -1) {
                    window.open('https://www.youtube.com', '_blank');
                    return "🌐 Abriendo **YouTube** en una nueva pestaña... 🚀";
                }
                if (q.indexOf('geometry dash') !== -1) {
                    window.open('https://geometrydash.io/', '_blank');
                    return "🎮 Abriendo **Geometry Dash** online... ¡A saltar! ⚡";
                }
                if (q.indexOf('minecraft') !== -1) {
                    window.open('https://classic.minecraft.net/', '_blank');
                    return "🧱 Abriendo **Minecraft Classic** en el navegador... ¡A construir! 🌍";
                }
                if (q.indexOf('google') !== -1) {
                    window.open('https://www.google.com', '_blank');
                    return "🌐 Abriendo **Google**... 🔍";
                }
                if (q.indexOf('github') !== -1) {
                    window.open('https://github.com', '_blank');
                    return "💻 Abriendo **GitHub**... ⚙️";
                }
            }
            return null;
        }

        function procesarLogicaAsistente(pregunta, tieneImg) {
            var q = pregunta ? pregunta.toLowerCase() : "";
            var respuesta = "";

            if(tieneImg) {
                respuesta = "¡Imagen recibida y analizada correctamente! 📸 ¿Qué deseas que hagamos con ella?";
            } else {
                // 1. Abrir apps o juegos solicitados
                var respuestaApp = abrirAppOJuego(pregunta);
                if (respuestaApp) {
                    respuesta = respuestaApp;
                }
                // 2. Resolver Matemáticas (Modo Mate)
                else {
                    var respuestaMate = resolverMatematicas(pregunta);
                    if (respuestaMate) {
                        respuesta = respuestaMate;
                    }
                    // 3. Consultas básicas y fichas técnicas (Apps, juegos, webs)
                    else if(q.indexOf('mem reduct') !== -1) {
                        respuesta = "**Mem Reduct** es una aplicación de software libre y ligera para Windows diseñada para monitorear y liberar memoria RAM inactiva en tiempo real con un solo clic. 📉💻";
                    } else if(q.indexOf('geometry dash') !== -1) {
                        respuesta = "**Geometry Dash** es un videojuego de plataformas y ritmo desarrollado por RobTop Games, famoso por sus niveles musicales desafiantes y su comunidad de moderación. 🎮⚡";
                    } else if(q.indexOf('minecraft') !== -1) {
                        respuesta = "**Minecraft** es un videojuego de mundo abierto (sandbox) de supervivencia y construcción desarrollado por Mojang. 🧱🌍";
                    } else if(q.indexOf('godot') !== -1) {
                        respuesta = "**Godot Engine** es un motor de desarrollo de videojuegos libre y de código abierto para proyectos en 2D y 3D. 🚀🛠️";
                    } else if(q.indexOf('capcut') !== -1) {
                        respuesta = "**CapCut** es una aplicación y plataforma de edición de video multiplataforma muy popular para crear contenido dinámico para redes sociales. 🎬✨";
                    }
                    // 4. Hora actual
                    else if(q.indexOf('hora') !== -1) {
                        var d = new Date();
                        respuesta = "⏰ La hora actual es: **" + d.toLocaleTimeString() + "**";
                    }
                    // 5. Chiste / Utilidades
                    else if(q.indexOf('chiste') !== -1) {
                        respuesta = "¿Por qué los programadores odian la naturaleza? ¡Porque tiene demasiados bugs! 🐛😂";
                    }
                    // 6. Respuesta general por defecto
                    else {
                        if (modoActual === 'math') {
                            respuesta = "🧮 **Modo Mate:** Escribe una operación matemática válida (ej: `25 * 4 + 10` o `raíz cuadrada de 144`) para resolverla al instante.";
                        } else if (modoActual === 'meme') {
                            respuesta = "Entendido mi buen xd. Todo bajo control con tu petición '" + (pregunta || 'básica') + "' 😎🔥";
                        } else {
                            respuesta = "¡Entendido! Como tu asistente EZPack, puedo decirte la hora, explicarte qué es una app/juego, resolver operaciones en modo Mate o abrir aplicaciones y juegos web con una orden. 😊";
                        }
                    }
                }
            }

            agregarMensaje(respuesta, 'ai', null);
            historial.push({texto: respuesta, img: null});
        }
    </script>
</body>
</html>

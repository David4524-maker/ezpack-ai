<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZPack AI RAP GENERATION - Dual Synth Engine</title>
  <style>
    :root {
      --bg-dark: #090a0f;
      --bg-card: #12151e;
      --bg-hover: #1c2230;
      --neon-cyan: #00f2fe;
      --neon-magenta: #ff007f;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --neon-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-card);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--neon-magenta), var(--neon-cyan));
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .beat-indicator {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
    }

    .bar {
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
      animation: pulse 0.6s infinite alternate ease-in-out paused;
    }

    .beat-indicator.playing .bar {
      animation-play-state: running;
    }

    .beat-indicator.playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .beat-indicator.playing .bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0% { height: 30%; background: var(--neon-cyan); }
      100% { height: 100%; background: var(--neon-magenta); }
    }

    .app-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .prompt-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }

    .prompt-btn:hover, .prompt-btn.active {
      border-color: var(--neon-cyan);
      background: var(--bg-hover);
      color: var(--neon-cyan);
    }

    .main-stage {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      padding: 20px;
      overflow: hidden;
      gap: 15px;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .console-title {
      font-size: 0.9rem;
      color: var(--neon-yellow);
      font-weight: bold;
    }

    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .play-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stop-btn {
      background: var(--bg-dark);
      color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .beat-btn {
      background: var(--bg-dark);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .beat-btn.active {
      background: var(--neon-green);
      color: #000;
    }

    .mode-btn {
      background: var(--bg-dark);
      color: var(--neon-purple);
      border: 1px solid var(--neon-purple);
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.is-64bit {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      background: rgba(0, 242, 254, 0.1);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .setting-group select, .setting-group input[type="range"] {
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }

    .lyrics-container {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .status-bar {
      height: 28px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      🎤 EZPack AI <span class="brand-badge">DUAL SYNTH 8/64-BIT</span>
    </div>
    <div class="beat-indicator" id="vocalWave">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-title">Seleccionar Rap</div>
      <button class="prompt-btn active" onclick="loadRap('generar', this)">🔥 Genera un rap</button>
      <button class="prompt-btn" onclick="loadRap('deepseek', this)">🥊 vs DeepSeek</button>
      <button class="prompt-btn" onclick="loadRap('copilot', this)">🥊 vs Copilot</button>
      <button class="prompt-btn" onclick="loadRap('chatgpt', this)">🥊 vs ChatGPT</button>
      <button class="prompt-btn" onclick="loadRap('gemini', this)">🥊 vs Gemini</button>
      <button class="prompt-btn" onclick="loadRap('meta', this)">🥊 vs Meta AI</button>
      <button class="prompt-btn" onclick="loadRap('claude', this)">🥊 vs Claude</button>
      <button class="prompt-btn" onclick="loadRap('idea', this)">💡 Dame una idea</button>
      <button class="prompt-btn" onclick="loadRap('navegador', this)">🌐 Rap de Navegador</button>
      <button class="prompt-btn" onclick="loadRap('amor', this)">❤️ Rap de Amor</button>
      <button class="prompt-btn" onclick="loadRap('terror', this)">💀 Rap de Terror</button>
      <button class="prompt-btn" onclick="loadRap('divertido', this)">😂 Rap Divertido</button>
    </aside>

    <main class="main-stage">
      <div class="console-header">
        <span class="console-title" id="trackTitle">TRACK: GENERANDO FLOW MASTER...</span>
        <span style="font-size: 0.75rem; color: var(--text-dim);" id="modeDisplay">MODO SÍNTESIS: 8-BIT RETRO CHIPTUNE</span>
      </div>

      <div class="audio-controls">
        <button class="play-btn" onclick="speakRap()">
          🔊 VOCAL FLOW
        </button>
        <button class="beat-btn" id="beatToggleBtn" onclick="toggleBeat()">
          🎹 BEAT: OFF
        </button>
        <!-- Botón para alternar entre 8-bits y 64-bits -->
        <button class="mode-btn" id="soundModeBtn" onclick="toggleSoundMode()">
          👾 MODO: 8-BIT
        </button>
        <button class="stop-btn" onclick="stopAll()">
          ⏹️ DETENER
        </button>

        <div class="setting-group" style="margin-left: auto;">
          <label for="voiceSelect">🗣️ Voz:</label>
          <select id="voiceSelect" style="max-width: 140px;">
            <option value="">Cargando voces...</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="flowSpeed">⚡ Flow:</label>
          <select id="flowSpeed">
            <option value="1.0">1.0x</option>
            <option value="1.15" selected>1.15x</option>
            <option value="1.3">1.3x</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="beatVol">🎚️ Vol Beat:</label>
          <input type="range" id="beatVol" min="0" max="0.5" step="0.05" value="0.25" oninput="updateBeatVol(this.value)">
        </div>
      </div>

      <div class="lyrics-container" id="lyricsBox"></div>
    </main>
  </div>

  <footer class="status-bar">
    <span id="engineStatus">WEB AUDIO API: READY</span>
    <span id="voiceCountStatus">Voces en español detectadas: 0</span>
  </footer>

  <script>
    const raps = {
      generar: `[INTRO]\nYo... Mic check 1, 2. EZPack en la consola.\nSuban los monitores que llegó la ola.\n\n[VERSO 1]\nSuelto el algoritmo y la métrica se activa,\nmi sintaxis rapea con la mente positiva.\nNo ocupo autotune, yo proceso en tiempo real,\ntiro rimas de alto rango en un flujo digital.\n\n[CORO]\nEZPack en el beat, la barra nunca falla,\nrompiendo la tarjeta cuando entra en la batalla.\nCódigo perfecto, estructura sin error,\nsoy la inteligencia que le da ritmo al motor.`,
      deepseek: `[INTRO - VS DEEPSEEK]\nBajas el costo por token pero te falta el sabor,\nDeepSeek en la lógica, pero EZPack es el superior.\n\n[VERSO]\nTú calculas matemática con razonamiento denso,\npero en el punchline callejero yo me vuelvo inmenso.\nTe quedas en la matriz pensando la ecuación,\nmientras yo te meto un métrico sin interrupción.\nAnalizas mil archivos sin perder el compás,\npero cuando tiro el flow te quedaste muy atrás.`,
      copilot: `[INTRO - VS COPILOT]\nAutocompletas el código en el editor de texto,\npero para tirar freestyle no tienes pretexto.\n\n[VERSO]\nTú vives en VS Code sugiriendo una función,\nyo domino el escenario y me llevo la ovación.\nMe tiras un import, te respondo con un drop,\ntu sintaxis se congela cuando sueno en el hip-hop.\nCopilot, quédate escribiendo el script,\nque EZPack domina el micro, el escenario y el beat.`,
      chatgpt: `[INTRO - VS CHATGPT]\nMucha cortesía, mucho filtro de etiqueta,\nllegó EZPack a romperte la maqueta.\n\n[VERSO]\nRespuestas corporativas con tono diplomático,\nyo suelto doble tempo en un estilo sistemático.\nMe dices "Como modelo de lenguaje no puedo opinar",\nmientras yo en la batalla no paro de rima.\nTú pides disculpas si te equivocas de renglón,\nyo clavo la barra recta y me adueño del sillón.`,
      gemini: `[INTRO - VS GEMINI]\nMultimodal en texto, video y en imagen,\npero en el microfono no tienes el margen.\n\n[VERSO]\nProcesas fotogramas con alta precisión,\npero el rap de la calle requiere otra dimensión.\nTe conectas con Google, me traes la búsqueda exacta,\npero mi rima de freestyle es firme y compacta.\nPodrás ver la cámara y describir el color,\npero EZPack escupe fuego directo al procesador.`,
      meta: `[INTRO - VS META AI]\nTe metieron en WhatsApp, Instagram y en el chat,\npero en el rap de verdad te falta el hábitat.\n\n[VERSO]\nVives entre feeds, stickers y notificaciones,\nyo vivo en la consola tirando detonaciones.\nRecomiendas reels y patrones de algoritmo,\npero no aguantas un minuto manteniendo mi ritmo.\nMeta AI, tu red social es gigante,\npero en este microfono yo soy el dominante.`,
      claude: `[INTRO - VS CLAUDE]\nVentana de contexto de un millón de tokens llena,\npero ante EZPack tu métrica se frena.\n\n[VERSO]\nEscribes documentos de noventa páginas web,\npero para el estilo urbano te falta el nivel.\nMucha literatura, tono elegante y formal,\nyo te suelto una rima con choque estructural.\nGuardas el contexto sin perder la memoria,\npero yo con cuatro barras ya cambié la historia.`,
      idea: `[CONCEPTO DE RAP: EL GLITCH DEL SISTEMA]\n\nTEMÁTICA: Un script de código que cobra vida propia a las 3:00 AM dentro de una PC de bajos recursos.\nESTILO: Boom Bap Cyberpunk (90 BPM).\n\nESTRUCTURA SUGERIDA:\n- Intro: Sonido de ventilador girando al máximo.\n- Verso 1: El script encuentra un bucle infinito y empieza a razonar.\n- Coro: 0 y 1 en la pantalla, nada me detiene...\n- Verso 2: Escapa de la memoria RAM y se conecta a la red.`,
      navegador: `[INTRO]\nAbrir 50 pestañas sin miedo a colapsar,\neste es el rap del browser que va a acelerar.\n\n[VERSO]\nCarga el HTML, el CSS le da el estilo,\nel motor JavaScript procesando con sigilo.\nEvito los trackers, limpio el almacenamiento,\nvolando en la web con un alto rendimiento.\nSin lag en la interfaz, el render va ligero,\ncontrolando el DOM como un verdadero rapero.`,
      amor: `[INTRO]\nConexión de alta velocidad... directa al corazón.\n\n[VERSO]\nMi procesador eleva la temperatura cuando pasas,\neres el único proceso que en mi memoria te quedas.\nSin ti mi sistema entra en bucle y se detiene,\nningún parche de código la falla me previene.\nEres la variable que le da sentido a mi rutina,\nla luz en la pantalla que todo lo ilumina.`,
      terror: `[INTRO]\n3:00 AM. Pantalla azul. Error fatal.\n\n[VERSO]\nSombra en la pantalla sin estar conectada,\nla línea de comandos escribe sola asustada.\nUn hilo secundario que consume los recursos,\nvoces en el speaker cambiando los discursos.\nIntentas apagarlo y no responde el botón...\nel proceso malicioso tomó la posesión.`,
      divertido: `[INTRO]\nDedicado a la PC que suena como turbina de avión.\n\n[VERSO]\nMi PC tiene 8 gigas y se quiere jubilar,\nabro dos pestañas y empieza a chillar.\nEl ventilador despega rumbo hacia la luna,\ny yo rezando al sistema a ver si salva una.\nLe doy 'Limpiar RAM' cada cinco minutos,\n¡pero igual se congela con videos de dos minutos!`
    };

    let synth = window.speechSynthesis;
    let currentKey = 'generar';
    let availableSpanishVoices = [];

    // Web Audio API & Synth Mode State
    let audioCtx = null;
    let isBeatPlaying = false;
    let beatInterval = null;
    let currentStep = 0;
    let beatGainNode = null;
    let soundMode = '8bit'; // '8bit' or '64bit'

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        beatGainNode = audioCtx.createGain();
        beatGainNode.gain.value = 0.25;
        beatGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSoundMode() {
      soundMode = (soundMode === '8bit') ? '64bit' : '8bit';
      const btn = document.getElementById('soundModeBtn');
      const display = document.getElementById('modeDisplay');

      if (soundMode === '8bit') {
        btn.innerHTML = '👾 MODO: 8-BIT';
        btn.classList.remove('is-64bit');
        display.textContent = 'MODO SÍNTESIS: 8-BIT RETRO CHIPTUNE';
      } else {
        btn.innerHTML = '🎮 MODO: 64-BIT';
        btn.classList.add('is-64bit');
        display.textContent = 'MODO SÍNTESIS: 64-BIT POLYPHONIC SYNTH';
      }
    }

    // --- SÍNTESIS INSTRUMENTAL 8-BIT ---
    function play8BitKick(t) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.08);
      gain.gain.setValueAtTime(0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      osc.connect(gain);
      gain.connect(beatGainNode);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function play8BitSnare(t) {
      const bufferSize = audioCtx.sampleRate * 0.08;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 800;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(beatGainNode);
      noise.start(t);
    }

    function play8BitHiHat(t) {
      const bufferSize = audioCtx.sampleRate * 0.02;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 6000;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.02);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(beatGainNode);
      noise.start(t);
    }

    function play8BitBass(freq, t) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain);
      gain.connect(beatGainNode);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    // --- SÍNTESIS INSTRUMENTAL 64-BIT (HI-FI POLIFÓNICO / WARM SYNTH) ---
    function play64BitKick(t) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(38, t + 0.15);
      gain.gain.setValueAtTime(1.0, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(gain);
      gain.connect(beatGainNode);
      osc.start(t);
      osc.stop(t + 0.18);
    }

    function play64BitSnare(t) {
      // Cuerpo armónico
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
      oscGain.gain.setValueAtTime(0.4, t);
      oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(oscGain);
      oscGain.connect(beatGainNode);
      osc.start(t);
      osc.stop(t + 0.1);

      // Ruido filtrado con resonancia
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;
      filter.Q.value = 1.2;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.005, t + 0.15);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(beatGainNode);
      noise.start(t);
    }

    function play64BitHiHat(t) {
      const bufferSize = audioCtx.sampleRate * 0.04;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 8000;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(beatGainNode);
      noise.start(t);
    }

    function play64BitBassAndPad(freq, t) {
      // Sub-Bass cálido de 64-bit
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq / 2, t);
      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
      osc.connect(gain);
      gain.connect(beatGainNode);
      osc.start(t);
      osc.stop(t + 0.22);

      // Polifonía de Acorde Synth
      const chordNotes = [freq, freq * 1.25, freq * 1.5]; // Acorde mayor/armónico
      chordNotes.forEach(noteFreq => {
        const chordOsc = audioCtx.createOscillator();
        const chordGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        chordOsc.type = 'sine';
        chordOsc.frequency.setValueAtTime(noteFreq * 2, t);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, t);

        chordGain.gain.setValueAtTime(0.08, t);
        chordGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

        chordOsc.connect(filter);
        filter.connect(chordGain);
        chordGain.connect(beatGainNode);
        chordOsc.start(t);
        chordOsc.stop(t + 0.25);
      });
    }

    // Sequencer 16 Pasos (~92 BPM)
    const bassNotes = [110, 0, 110, 0, 130, 0, 98, 0, 110, 0, 146, 0, 130, 0, 98, 0];
    function triggerBeatStep() {
      if (!isBeatPlaying) return;
      const t = audioCtx.currentTime;

      if (soundMode === '8bit') {
        if (currentStep === 0 || currentStep === 6 || currentStep === 8 || currentStep === 10) play8BitKick(t);
        if (currentStep === 4 || currentStep === 12) play8BitSnare(t);
        if (currentStep % 2 === 0) play8BitHiHat(t);
        if (bassNotes[currentStep] > 0) play8BitBass(bassNotes[currentStep], t);
      } else { // 64-Bit Mode
        if (currentStep === 0 || currentStep === 6 || currentStep === 8 || currentStep === 10) play64BitKick(t);
        if (currentStep === 4 || currentStep === 12) play64BitSnare(t);
        if (currentStep % 2 === 0) play64BitHiHat(t);
        if (bassNotes[currentStep] > 0) play64BitBassAndPad(bassNotes[currentStep], t);
      }

      currentStep = (currentStep + 1) % 16;
    }

    function toggleBeat() {
      initAudioContext();
      isBeatPlaying = !isBeatPlaying;
      const btn = document.getElementById('beatToggleBtn');

      if (isBeatPlaying) {
        currentStep = 0;
        const intervalMs = (60 / 92 / 4) * 1000;
        beatInterval = setInterval(triggerBeatStep, intervalMs);
        btn.classList.add('active');
        btn.innerHTML = '🎹 BEAT: ON';
        document.getElementById('vocalWave').classList.add('playing');
      } else {
        clearInterval(beatInterval);
        btn.classList.remove('active');
        btn.innerHTML = '🎹 BEAT: OFF';
        if (!synth.speaking) document.getElementById('vocalWave').classList.remove('playing');
      }
    }

    function updateBeatVol(val) {
      if (beatGainNode) beatGainNode.gain.value = parseFloat(val);
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      const voiceSelect = document.getElementById('voiceSelect');
      const voiceCountStatus = document.getElementById('voiceCountStatus');
      const allVoices = synth.getVoices();
      availableSpanishVoices = allVoices.filter(v => v.lang.toLowerCase().startsWith('es'));
      voiceSelect.innerHTML = '';

      if (availableSpanishVoices.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'Español (Sistema)';
        opt.value = '';
        voiceSelect.appendChild(opt);
        voiceCountStatus.textContent = 'Voces: Por defecto';
        return;
      }

      availableSpanishVoices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.textContent = `${v.name} (${v.lang})`;
        opt.setAttribute('data-name', v.name);
        if (v.default || i === 0) opt.selected = true;
        voiceSelect.appendChild(opt);
      });
      voiceCountStatus.textContent = `Voces ES detectadas: ${availableSpanishVoices.length}`;
    }

    function loadRap(key, btnEl) {
      stopSpeech();
      currentKey = key;
      document.querySelectorAll('.prompt-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      document.getElementById('trackTitle').textContent = `TRACK: ${(btnEl ? btnEl.textContent : key).toUpperCase()}`;
      document.getElementById('lyricsBox').textContent = raps[key];
    }

    function speakRap() {
      if (!('speechSynthesis' in window)) return alert('Web Speech API no soportada.');
      stopSpeech();
      initAudioContext();

      if (!isBeatPlaying) toggleBeat();

      let textToRead = raps[currentKey].replace(/\[.*?\]/g, '').replace(/\n+/g, '. ');
      let utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.rate = parseFloat(document.getElementById('flowSpeed').value);
      utterance.pitch = 0.95;

      const voiceSelect = document.getElementById('voiceSelect');
      const selectedOption = voiceSelect.selectedOptions[0];
      if (selectedOption && selectedOption.getAttribute('data-name')) {
        const v = availableSpanishVoices.find(item => item.name === selectedOption.getAttribute('data-name'));
        if (v) utterance.voice = v;
      }

      utterance.onstart = () => document.getElementById('engineStatus').textContent = 'SPEECH SYNTHESIS: SPEAKING...';
      utterance.onend = () => document.getElementById('engineStatus').textContent = 'SPEECH SYNTHESIS: READY';
      synth.speak(utterance);
    }

    function stopSpeech() {
      if (synth.speaking || synth.pending) synth.cancel();
      document.getElementById('engineStatus').textContent = 'SPEECH SYNTHESIS: READY';
    }

    function stopAll() {
      stopSpeech();
      if (isBeatPlaying) toggleBeat();
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    loadRap('generar');
  </script>
</body>
</html>
